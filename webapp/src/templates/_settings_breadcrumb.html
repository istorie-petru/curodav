<!-- Settings hierarchy back-nav (Settings redesign, 2026-08-08).

     Every page that lives inside the Settings area -- the hub's six child
     views (General/Appearance/Data & backup/Widgets/Advanced) plus Labels
     and Data & backup's own children (Habits/Published lists/Export) --
     includes this instead of each inventing its own "back to X" link.
     `crumbs` is a list of {url, name} dicts for every ancestor, root
     first (always starts with Settings itself); the current page's own
     name is `title` and renders last, unlinked -- so "Settings → Data →
     Habits" reads left to right and only the trail is clickable. This is
     what makes Back inside Settings predictable (plans/settings-rework
     2026-08-08 redesign, item 3: Settings → Labels → Back returns to
     Settings, not whatever page was open before Settings was ever
     entered) without relying on browser history, which would break for
     anyone who deep-links straight into a child page. -->
<nav class="breadcrumb settings-breadcrumb" aria-label="Settings">
    {% for c in crumbs %}<a href="{{ c.url }}">{% if loop.first %}{{ icon('chevron-left', 'icon-sm') }}{% endif %}{{ c.name }}</a>{% if not loop.last %}<span class="breadcrumb-sep">/</span>{% endif %}{% endfor %}
</nav>
