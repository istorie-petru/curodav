<!-- Data: {overdue_count, today_count, week_count, important_count,
     urgent_count, overdue_link, today_link, week_link, important_link,
     urgent_link} -- see routers/dashboard.py::_render_at_a_glance. Five
     number+label stat blocks, each a link to the matching filtered Tasks
     view (?date_filter=overdue/today/this_week/important/urgent, plus
     &label=<name> when this widget is scoped to a label page). Zero counts
     still render -- "nothing's overdue" is itself useful at-a-glance
     information, not an empty state to hide. The counts come from the
     shared aggregation service (src/derived_state.py's count_by_state), so
     they can never disagree with what the linked filtered Tasks view
     actually shows. -->
<div class="at-a-glance-row">
    <a class="at-a-glance-stat" href="{{ data.overdue_link }}">
        <div class="at-a-glance-number is-overdue">{{ data.overdue_count }}</div>
        <div class="widget-section-label">Overdue</div>
    </a>
    <a class="at-a-glance-stat" href="{{ data.today_link }}">
        <div class="at-a-glance-number">{{ data.today_count }}</div>
        <div class="widget-section-label">Due today</div>
    </a>
    <a class="at-a-glance-stat" href="{{ data.week_link }}">
        <div class="at-a-glance-number">{{ data.week_count }}</div>
        <div class="widget-section-label">Due this week</div>
    </a>
    <a class="at-a-glance-stat" href="{{ data.important_link }}">
        <div class="at-a-glance-number">{{ data.important_count }}</div>
        <div class="widget-section-label">Important</div>
    </a>
    <a class="at-a-glance-stat" href="{{ data.urgent_link }}">
        <div class="at-a-glance-number is-overdue">{{ data.urgent_count }}</div>
        <div class="widget-section-label">Urgent</div>
    </a>
</div>
