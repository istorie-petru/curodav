{% extends "base.html" %}
{% block title %}Address books{% endblock %}
{% block content %}
<!-- see event_form.html for why this is wrapped -- static/modal.js -->
<div id="modal-target">
<h1>Address books</h1>

<!-- Two fixed address books -- Active and Archived.  No create/delete
     buttons: the two-addressbook model (§4) replaces arbitrary books with
     these two fixed collections; grouping is via tags instead. -->
<div class="calendar-list">
{% for a in addressbooks %}
<div class="calendar-row">
    <!-- Project association -- the only thing still editable per-book. -->
    <form method="post" action="/addressbooks/{{ a.uid }}/edit" class="calendar-row-edit-form" data-modal-keep-open>
        <span class="cell-tag cal-{{ a.color }}" style="min-width:8px; margin-right:8px"></span>
        <span style="font-weight:500">{{ a.name }}</span>
        <span style="flex:1"></span>
        {% if projects %}
        <select name="project_uid" class="filter-select" onchange="this.form.requestSubmit()" aria-label="Project">
            <option value="">(no project)</option>
            {% for p in projects %}
            <option value="{{ p.uid }}" {% if a.project_uid == p.uid %}selected{% endif %}>{{ p.name }}</option>
            {% endfor %}
        </select>
        {% endif %}
    </form>
    <!-- No delete button -- these two books are fixed. -->
</div>
{% endfor %}
</div>

<div class="toolbar" style="margin-top:16px">
    <a href="/contacts" data-modal-cancel>{{ icon('chevron-left', 'icon-sm') }} Done</a>
    <div class="spacer"></div>
    <a class="btn ghost" href="/addressbooks/import">{{ icon('upload', 'icon-sm') }} Import</a>
</div>
</div>
{% endblock %}
