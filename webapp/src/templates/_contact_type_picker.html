{% from "_inputs.html" import radio_input %}
{% macro contact_type_picker(field_name, options, selected, row_key, extra_class='', form_id='') %}
{% set _form = form_id or ms_form_id %}
{% set proxy_id = field_name ~ '-proxy-' ~ row_key %}
<div class="multiselect widget-list-multiselect contact-type-select {{ extra_class }}" data-ms data-ms-mode="single" data-ms-label="{{ field_name | replace('_', ' ') }}">
    <button type="button" class="multiselect-trigger ms-trigger" aria-haspopup="true" aria-expanded="false">
        <span class="ms-summary">{{ selected }}</span>
        <span class="filter-caret">{{ icon('chevron-down', 'icon-sm') }}</span>
    </button>
    <div class="multiselect-panel ms-panel">
        {% for t in options %}
        <label class="multiselect-option">
            {{ radio_input({'name': (field_name) ~ '__' ~ (row_key), 'value': t, 'class': 'contact-type-radio', 'data-proxy-name': field_name, 'data-proxy-target': proxy_id, 'form': _form, 'checked': (true if (t == selected) else false)}) }}
            <span>{{ t }}</span>
        </label>
        {% endfor %}
    </div>
</div>
<input type="hidden" id="{{ proxy_id }}" name="{{ field_name }}" value="{{ selected }}" class="contact-type-proxy" form="{{ _form }}">
{% endmacro %}
