<!-- Data: {current_streak, longest_streak, completed_today} -- see
     routers/dashboard.py::_render_streak. Reads tasks.completed_at (auto-
     managed in db.upsert_task) -- current/longest run of consecutive days
     with at least one task completed. The two stats render through the
     shared stat_block macro, the nudge through widget_empty
     (_widget_items.html). -->
{% from "_widget_items.html" import stat_block, widget_empty %}
<div class="at-a-glance-row">
    {{ stat_block(data.current_streak, 'Day streak') }}
    {{ stat_block(data.longest_streak, 'Longest streak') }}
</div>
{% if not data.completed_today %}
{{ widget_empty('Complete a task today to keep your streak going.') }}
{% endif %}
