<!-- Live preview fragment (routers/dashboard.py's preview_widget) -- reuses
     the exact same widget partial + render function the real widget would
     use once added, so this isn't a mockup or an approximation, it's the
     actual thing rendered with a fake uid ("preview", only ever used for
     the Mini Calendar's prev/next anchor links, which don't need to go
     anywhere meaningful here). static/dashboard_widget_preview.js fetches
     this into the Add-widget/Filters form's preview pane on every change. -->
<div class="card widget-card widget-preview-card">
    <div class="widget-header"><h2>{{ widget.title or (spec.label if spec else "Preview") }}</h2></div>
    {% if spec %}
    {% include spec.template %}
    {% else %}
    <div class="empty-state" style="padding:16px 0">Pick a data source to preview.</div>
    {% endif %}
</div>
