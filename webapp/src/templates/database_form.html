{% extends "base.html" %}
{% block title %}{% if database %}Edit database{% else %}New database{% endif %}{% endblock %}
{% block content %}
<h1>{% if database %}Edit database{% else %}New database{% endif %}</h1>

<div class="card">
<form method="post" action="{% if database %}/databases/{{ database.uid }}/edit{% else %}/databases{% endif %}">
    <div class="field-grid">
        <div class="field field-wide">
            <label>Name</label>
            <input type="text" name="name" required value="{{ database.name if database else '' }}">
        </div>
        <div class="field field-wide">
            <label>Description</label>
            <textarea name="description" rows="2">{{ database.description if database else '' }}</textarea>
        </div>
        <div class="field">
            <label>Color</label>
            <select name="color">
                {% for col in colors %}
                <option value="{{ col }}" {% if database and database.color == col %}selected{% endif %}>{{ col }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="field">
            <label>Icon (emoji or short glyph)</label>
            <input type="text" name="icon" value="{{ database.icon if database else '' }}" class="project-icon-input">
        </div>
        <div class="field">
            <label>Project</label>
            <select name="project_uid">
                <option value="">(no project)</option>
                {% for p in projects %}
                <option value="{{ p.uid }}" {% if database and database.project_uid == p.uid %}selected{% endif %}>{{ p.name }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="field field-wide">
            <label>Tags (comma-separated)</label>
            <input type="text" name="tags" class="tag-input" list="tag-names-datalist" value="{{ database.tags|join(', ') if database else '' }}">
            <datalist id="tag-names-datalist">
                {% for name in tag_names %}<option value="{{ name }}">{% endfor %}
            </datalist>
        </div>
    </div>
    <button type="submit" class="btn primary">Save</button>
    <a href="{% if database %}/databases/{{ database.uid }}{% else %}/databases{% endif %}" class="btn ghost">Cancel</a>
</form>
</div>

{% if database %}
<form method="post" action="/databases/{{ database.uid }}/delete" data-confirm-sheet="Delete &quot;{{ database.name }}&quot; and all its columns/rows? This cannot be undone.">
    <button type="submit" class="btn danger">{{ icon('trash', 'icon-sm') }} Delete this database</button>
</form>
{% endif %}
{% endblock %}
