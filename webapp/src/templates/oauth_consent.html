<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Connect an app — Curodav</title>
    <link rel="icon" type="image/png" sizes="32x32" href="{{ static_url('favicon-32.png') }}">
    <link rel="stylesheet" href="{{ static_url('style.css') }}">
    <script nonce="{{ csp_nonce() }}">
      (function () {
        var stored = localStorage.getItem("commandCenterWeb.theme");
        var theme = stored || (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
        if (theme === "dark") document.documentElement.setAttribute("data-theme", "dark");
      })();
    </script>
</head>
<body>
    <div class="auth-wrap">
        <div class="auth-card">
            <h1 class="auth-brand">{{ icon('command') }} Connect an app</h1>
            {% if error %}
            <p class="auth-error" role="alert">{{ error }}</p>
            {% else %}
            <p><strong>{{ client_name }}</strong> asks for access to Curodav. It returns to {{ redirect_host }}.</p>
            <form method="post" action="/oauth/authorize">
                {% for key, value in fields.items() %}
                <input type="hidden" name="{{ key }}" value="{{ value }}">
                {% endfor %}
                <div class="field-grid">{% include "_api_scope_switches.html" %}</div>
                <button type="submit" name="decision" value="allow" class="btn primary auth-submit" autofocus>Allow</button>
                <button type="submit" name="decision" value="deny" class="btn auth-submit">Cancel</button>
            </form>
            {% endif %}
        </div>
    </div>
</body>
</html>
