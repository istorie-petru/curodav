{% extends "base.html" %}
{% block title %}Import contacts{% endblock %}
{% block content %}
<!-- Plain full page, not a modal -- see calendars_import.html's note on
     why. -->
<h1>Import contacts</h1>

<p style="color:var(--fg-tertiary); font-size:var(--text-footnote); margin:0 0 16px">
    Upload a .vcf file (a single contact, or several exported together). Every contact
    in it will be imported into the <strong>Active</strong> address book.
</p>

<div class="card">
<form method="post" action="/addressbooks/import" class="export-form" enctype="multipart/form-data">
    <div class="field" style="margin-top:14px; max-width:320px">
        <label>.vcf file</label>
        <input type="file" name="file" accept=".vcf,text/vcard" required>
    </div>

    <button type="submit" class="btn primary">Import</button>
    <a href="/contacts" class="btn ghost">Cancel</a>
</form>
</div>
{% endblock %}
