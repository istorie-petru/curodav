<!-- Add-widget form + live preview -- shared by the Dashboard/Space page's
     edit-mode "Add widget" <details> (_widget_workspace.html) and the
     Customize modal's Widget Builder (dashboard_customize.html) so there is
     exactly one copy of the Source/View/Range/title/filters fields.
     The *fields* live in _widget_builder_fields.html; this partial owns the
     <form> wrapper, the Add button, and the preview pane for the stacked
     workspace layout. When `widget_add_always_visible` is truthy the
     collapsible <details> wrapper is omitted so it renders inline, always
     open. Expects the same context _widget_builder_fields.html does:
     space_uid, widget_sources/widget_views/widget_ranges,
     projects, task_lists, calendars, tag_names. -->
{% if not widget_add_always_visible %}
<details class="widget-config widget-add-config" style="margin-bottom:16px">
<summary class="widget-add-summary">{{ icon('plus', 'icon-sm') }} <span class="ms-summary-text">Add widget</span><span class="filter-caret">{{ icon('chevron-down', 'icon-sm') }}</span></summary>
<div class="card widget-add-layout" style="margin-top:10px">
{% endif %}
<form method="post" id="widget-add-form" action="/dashboard/widgets" class="widget-select-form" data-preview-url="/dashboard/widgets/preview">
    {% set ms_form_id = 'widget-add-form' %}
    {% include "_widget_builder_fields.html" %}
    <input type="hidden" name="edit" value="{{ '1' if edit_mode else '' }}">
    <div class="field" style="margin-top:10px">
        <button type="submit" class="btn primary">Add widget</button>
    </div>
</form>

<div class="widget-preview-pane">
    <div class="widget-preview-content" id="widget-preview-content">
        <div class="empty-state" style="padding:16px 0">Loading preview&hellip;</div>
    </div>
</div>
{% if not widget_add_always_visible %}
</div>
</details>
{% endif %}
