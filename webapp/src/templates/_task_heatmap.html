<!-- Shared GitHub-style heatmap grid for a recurring task (Phase 5), used
     by task_detail.html. Server-rendered HTML, not canvas/JS -- every
     non-future day cell is its own tiny <form> posting a toggle
     (/tasks/{uid}/completion/{date}/toggle), so clicking a day is a single
     no-JS request. data-modal-keep-open keeps the detail page's modal open
     and just re-renders it with the updated state, same as the checklist
     rows. Each cell's `done`/`level` describe whether a task_completions
     row exists for that date (see tasks.py's _completion_heatmap_weeks). -->
{% macro heatmap(uid, weeks) %}
<div class="heatmap">
    <div class="heatmap-months">
        {% for week in weeks %}<span class="heatmap-month-label">{{ week[0].month_label or '' }}</span>{% endfor %}
    </div>
    <div class="heatmap-grid">
        {% for week in weeks %}
        <div class="heatmap-week">
            {% for day in week %}
            {% if day.is_future %}
            <span class="heatmap-cell level-future"></span>
            {% else %}
            <form method="post" action="/tasks/{{ uid }}/completion/{{ day.date }}/toggle" class="heatmap-cell-form" data-modal-keep-open>
                <button type="submit" class="heatmap-cell level-{{ day.level }}" title="{{ day.date }}{% if day.done %} &mdash; completed{% endif %}"></button>
            </form>
            {% endif %}
            {% endfor %}
        </div>
        {% endfor %}
    </div>
</div>
{% endmacro %}
