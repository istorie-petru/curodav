{% macro action_menu(items, aria_label='More actions') %}
{% if items %}
<div class="action-menu" aria-label="{{ aria_label }}">
    <button type="button" class="action-menu-trigger icon-btn" aria-label="{{ aria_label }}" aria-haspopup="true" aria-expanded="false">{{ icon('more', 'icon-sm') }}</button>
    <div class="action-menu-panel" role="menu">
        <div class="action-menu-section">
            {% for it in items %}
            {% if it.form_action %}
            <form class="form-inline{% if it.form_class %} {{ it.form_class }}{% endif %}" method="post" action="{{ it.form_action }}"
                  {% if it.change %}data-cc-change="{{ it.change }}" {% endif %}{% if it.confirm %}data-confirm-sheet="{{ it.confirm }}" {% endif %}{% if it.undo %}data-delete-undo="{{ it.undo }}" {% endif %}{% if it.archive_undo %}data-archive-undo="{{ it.archive_undo }}" {% endif %}{% if it.unarchive_url %}data-unarchive-url="{{ it.unarchive_url }}" {% endif %}>
                {% for k, v in (it.fields or {}).items() %}<input type="hidden" name="{{ k }}" value="{{ v }}">{% endfor %}
                <button type="submit" class="action-menu-item{% if it.danger %} danger{% endif %}" role="menuitem">{{ icon(it.icon, 'icon-sm') }} {{ it.label }}</button>
            </form>
            {% else %}
            <a class="action-menu-item{% if it.danger %} danger{% endif %}" role="menuitem" href="{{ it.href }}"{% if it.modal %} data-modal{% endif %}>{{ icon(it.icon, 'icon-sm') }} {{ it.label }}</a>
            {% endif %}
            {% endfor %}
        </div>
    </div>
</div>
{% endif %}
{% endmacro %}
