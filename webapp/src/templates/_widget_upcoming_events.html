<!-- Data: {events} -- see routers/dashboard.py::_render_upcoming_events -->
{% if data.events %}
<table>
    {% for e in data.events %}
    <tr>
        <td class="text-muted" style="width:110px">{{ e.start_at[:10] }}{% if not e.all_day %} {{ e.start_at | fmt_time }}{% endif %}</td>
        <td><a href="/events/{{ e.uid }}" data-modal>{{ e.title }}</a></td>
    </tr>
    {% endfor %}
</table>
{% else %}
<div class="empty-state">No upcoming events.</div>
{% endif %}
