{% macro detail_cover(accent, banner, badge_html, avatar_mode=false) %}
<div class="detail-cover-wrap">
    <div class="detail-cover">
        {% if banner %}
            {% if banner.version %}
            <img class="detail-cover-img" src="/banners/image?scope={{ banner.scope|urlencode }}&amp;v={{ banner.version }}" alt="">
            {% else %}
            <img class="detail-cover-img" src="{{ banner.image_url }}" alt="" referrerpolicy="no-referrer">
            {% endif %}
        {% else %}
        <div class="detail-cover-fill" data-style="--cover-accent:{{ accent }}"></div>
        {% endif %}
    </div>
    <div class="detail-cover-icon{% if avatar_mode %} detail-cover-icon-avatar{% endif %}"{% if not banner %} data-style="color:{{ accent }}"{% endif %}>{{ badge_html }}</div>
</div>
{% endmacro %}
