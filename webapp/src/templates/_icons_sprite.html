     v7.4.47 (commit 9e04201, 2023-12-26) -- 2026-09-24 direct request ("for
     icons I would like to use the Templarian/MaterialDesign-SVG"), replacing
     the hand-authored Feather-style stroke icons this file used to hold.

     This is a real style change, not just a technical swap: Feather icons
     are outline/stroke shapes (fill:none, a colored line), MDI icons are
     solid filled shapes (one <path>, fill:currentColor) -- style.css's
     `.icon` class flipped from `fill:none; stroke:currentColor;` to
     `fill:currentColor; stroke:none;` to match (its own comment has the
     detail); individual symbols below carry no fill/stroke of their own,
     they inherit that class-level default the same way the old ones relied
     on it for color (both old and new only ever varied stroke-width/
     linecap/geometry per symbol, never color).

     Symbol id (`icon-<name>`) is this app's own name -- Feather's naming
     where a Feather equivalent existed (`chevron-left`, `trash-2`, ...),
     the app's own descriptive name otherwise (`address-book`,
     `graduation-cap`, ...) -- NOT MDI's own icon name, which usually
     differs (MDI has no direct equivalent for several of these, e.g.
     `check-square` doesn't exist in MDI's naming at all; picked the
     closest real, verified-to-exist MDI icon for each rather than
     guessing at path data by hand). The mapping from this app's name to
     the real MDI source file it was pulled from is not tracked in the
     repo -- re-deriving one from scratch means picking the closest real
     MDI icon again, same as this pass did, not reading it off a lookup
     table that doesn't exist.

     routers/labels.py's ICON_GROUPS is the authoritative list of which of
     these are offered in the label/Space/habit icon picker -- 168 of the
     190 symbols below; the other 22 are chrome/functional icons this file
     also defines (chevrons, x, plus, alert-circle, ...) that were never
     part of the picker. See that file's own comment for the category
     groupings; this file stays flat/alphabetical since it's just a symbol
     definitions pool, not the picker UI itself.

     Two symbols this pass added, `rotate-ccw`/`x-circle`, were referenced
     by two of event_detail.html's own occurrence-override action buttons
     but never actually DEFINED anywhere in the old Feather sprite -- a
     pre-existing bug (those two buttons silently rendered no icon at
     all, `<use>` against a missing id fails silent in
     every browser) this pass's from-scratch symbol audit happened to
     catch and fix, not something this request asked for on its own.

     Included once, hidden, near the top of <body> (base.html) -- symbols
     referenced via local `#icon-name` fragments (not an external .svg
     file + <use href="/static/icons.svg#...">) specifically because
     cross-file SVG <use> has had inconsistent/broken support in Safari
     historically; an inline sprite referenced by local ID has none of
     that risk and costs nothing extra since base.html is already sent on
     every page load. -->
