     "Switch the whole icon library to Lucide, AGAIN, fully": this app's
     icons started as hand-authored Feather-style stroke icons, were
     swapped to real Material Design Icons (2026-09-24, see this file's
     own git history for that pass's comment), and are now swapped back to
     a REAL stroke-based set again -- Lucide specifically this time (a
     maintained fork/continuation of Feather, not a second hand-authored
     approximation of it), with actual verified-to-exist source files
     behind every symbol the same way the MDI pass insisted on, not
     path data guessed at by hand.

     This is a real style change back, not just a technical swap: MDI
     icons are solid filled shapes (one <path>, fill:currentColor);
     Lucide icons are outline/stroke shapes (fill:none, 2px stroke,
     round caps/joins) -- style.css's `.icon` class flipped from
     `fill:currentColor; stroke:none;` back to `fill:none;
     stroke:currentColor; stroke-width:2;` to match (its own comment has
     the detail, including this pass's new minimum-size/text-matched-size
     rule -- a thin stroke icon needs more room to read clearly than a
     solid filled shape did at the same pixel size, which is exactly why
     that rule exists now and didn't before). Individual symbols below
     carry no fill/stroke/stroke-width of their own, they inherit that
     class-level default -- same "class sets color/weight, symbol only
     varies geometry" split every icon set this file has ever held
     already used.

     Symbol id (`icon-<name>`) is this app's own name, UNCHANGED from the
     MDI pass (so no template callsite anywhere in the app needed to
     change) -- Feather's naming where a Feather equivalent existed
     (`chevron-left`, `trash-2`, ...), the app's own descriptive name
     otherwise (`family-tree`, `graduation-cap`, ...). For 190 - 159 = 31
     of these names, the real Lucide source file is NOT the same name
     (Lucide renamed several icons after Feather, or the app's own name
     was never a real Feather/Lucide/MDI name to begin with):
       address-book->contact, alert-circle->circle-alert,
       alert-triangle->triangle-alert, bar-chart->chart-no-axes-column,
       bar-chart-2->chart-column, check-circle->circle-check,
       check-square->square-check, columns->columns-3,
       edit->square-pen, edit-3->pen-line,
       git-commit->git-commit-vertical, grid->grid-3x3, home->house,
       home-heart->house-heart, layout->layout-panel-top,
       more->ellipsis, pie-chart->chart-pie, sidebar->panel-left,
       sliders->sliders-horizontal, stop-circle->circle-stop,
       tool->wrench, trash-2->trash (Lucide only ever had one trash
       icon; this app's own `trash`/`trash-2` ids render identically
       now, same as they did under MDI), unlock->lock-open,
       x-circle->circle-x, filter->list-filter -- all genuine Lucide
       renames/consolidations of the exact same concept, safe 1:1 swaps.
       candle->flame, chalkboard->presentation, confetti->sparkle,
       family-tree->list-tree, github->square-code, smile->face-grinning
       -- Lucide has no icon for these AT ALL (no candle, no literal
       family-tree/genealogy glyph, no brand/logo icons of any kind
       including GitHub's, no classic smiley-face -- Lucide's own scope
       deliberately excludes brand logos), so these six are the closest
       real, existing Lucide icon picked as a stand-in, same "closest
       real icon, not guessed path data" rule the MDI pass's own
       unmappable names followed. The mapping itself is not tracked
       anywhere else in the repo -- re-deriving one from scratch means
       picking the closest real Lucide icon again, same as this pass did.

     routers/labels.py's ICON_GROUPS is the authoritative list of which of
     these are offered in the label/Space/habit icon picker -- 168 of the
     190 symbols below; the other 22 are chrome/functional icons this file
     also defines (chevrons, x, plus, alert-circle, ...) that were never
     part of the picker. See that file's own comment for the category
     groupings; this file stays flat/alphabetical since it's just a symbol
     definitions pool, not the picker UI itself.

     Included once, hidden, near the top of <body> (base.html) -- symbols
     referenced via local `#icon-name` fragments (not an external .svg
     file + <use href="/static/icons.svg#...">) specifically because
     cross-file SVG <use> has had inconsistent/broken support in Safari
     historically; an inline sprite referenced by local ID has none of
     that risk and costs nothing extra since base.html is already sent on
     every page load. -->
