     "external scripts only from a CDN allowlist" not even being a thing
     this app does anywhere else). Replaces every emoji/HTML-entity glyph
     that used to stand in for an icon (checkboxes, moon/sun theme toggle,
     mail/phone, trash, subtask arrow, close/chevron) -- see templates/
     _icon.html for the {{ icon('name') }} macro that renders one of these.

     referenced via local `#icon-name` fragments (not an external .svg
     file + <use href="/static/icons.svg#...">) specifically because
