<!-- Data: {tasks, today} -- see routers/dashboard.py::_render_overdue_tasks -->
{% if data.tasks %}
<table>
    {% for t in data.tasks %}
    <tr>
        <td style="width:26px">
            <form class="form-inline" method="post" action="/tasks/{{ t.uid }}/complete">
                <button type="submit" class="icon-btn" title="Mark done">{{ icon('square') }}</button>
            </form>
        </td>
        <td><a href="/tasks/{{ t.uid }}" data-modal>{{ t.title }}</a></td>
        <td class="text-muted" style="text-align:right">{{ t.due_at[:10] }}</td>
    </tr>
    {% endfor %}
</table>
{% else %}
<div class="empty-state">Nothing overdue.</div>
{% endif %}
