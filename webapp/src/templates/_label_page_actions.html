{% if library_count %}<a href="/library?view=all&shelf={{ label.name|urlencode }}" class="icon-btn label-page-edit" title="In the library ({{ library_count }})" aria-label="In the library ({{ library_count }})">{{ icon('library', 'icon-sm') }}</a>
{% endif %}<a href="/settings/labels/{{ label.name|urlencode }}/edit" data-modal class="icon-btn label-page-edit" title="Edit shelf" aria-label="Edit shelf">{{ icon('edit', 'icon-sm') }}</a>
<a href="/settings/labels/{{ label.name|urlencode }}/merge-modal" data-modal class="icon-btn label-page-edit" title="Merge shelf" aria-label="Merge shelf">{{ icon('git-pull-request', 'icon-sm') }}</a>
