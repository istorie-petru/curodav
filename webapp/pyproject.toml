[project]
name = "command-center-web"
version = "2.1.0"
description = "Mobile/remote PWA client -- calendar, tasks, contacts, synced via CalDAV/CardDAV against a self-hosted Radicale server. Update 2026-08: local-only projects/tags (see src/db.py) were folded into the universal label/object_labels model (see features/architecture.md); a generic cross-type link/board graph was never carried over from the now-deleted desktop app (features/architecture.md Phase 8) -- accepted gap, not planned."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    # Pinned below 1.0: starlette 1.x's Jinja2Templates integration is
    # incompatible with jinja2 3.1.6 (currently the latest jinja2 release --
    # no 3.2 exists yet) -- `TemplateResponse` raises
    # `TypeError: cannot use 'tuple' as a dict key` on every render.
    # Confirmed via a minimal repro during development; revisit this pin
    # once either project ships a fix.
    "starlette<1.0",
    "uvicorn[standard]>=0.32",
    "jinja2>=3.1",
    "python-multipart>=0.0.12",
    "caldav>=1.3",
    "icalendar>=6.0",
    "vobject>=0.9.7",
    # httpx is a runtime import (caldav_bridge.py hand-rolls the CardDAV
    # side with it), not just a test dependency -- it must ship with the
    # production image/service. It used to live only in the dev group,
    # which a `uv sync --no-dev` deploy silently skipped, making the app
    # unbootable outside the dev environment (ModuleNotFoundError on
    # import). See deploy/README.md.
    "httpx>=0.27",
]

[project.scripts]
command-center-web = "src.main:main"
task-state = "src.task_cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "radicale>=3.3",
]
