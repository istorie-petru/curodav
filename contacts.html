    <!-- Theme must be applied before first paint, not after DOMContentLoaded
         (app.js used to do this at the bottom of <body>, which painted the
         light theme first and then flashed to dark once the script ran).
         Inline + synchronous + in <head> is the only way to beat first
         paint. Falls back to the OS-level preference via
         prefers-color-scheme when the user has never toggled the switch
         here (localStorage empty), instead of always defaulting to light. -->
    <script nonce="G4D1SIoq4yHkqkDQZReGMA">
      (function () {
        var KEY = "commandCenterWeb.theme";
        var stored = localStorage.getItem(KEY);
        var theme = stored || (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
        if (theme === "dark") document.documentElement.setAttribute("data-theme", "dark");
      })();
      // Sidebar expanded/collapsed state (2026-08-29, sidebar redesign
      // slice 13a) -- same "apply before first paint" reasoning as the
      // theme block above: doing this in sidebar_tree.js at the bottom of
      // <body> would paint the 80px collapsed rail first and then jump to
      // 240px once the script ran, on every load for anyone who'd chosen
      // expanded. Collapsed (no attribute) is the default for an install
      // that's never touched the toggle -- unlike theme there's no OS-level
      // signal to fall back to, so "unset" just means "collapsed."
      if (localStorage.getItem("commandCenterWeb.sidebarExpanded") === "1") {
        document.documentElement.setAttribute("data-sidebar-expanded", "1");
      }
      // Cross-document View Transitions support check (2026-08-11). The
      // CSS `main`-fade fallback (style.css's page-transitions block) must
      // only run in browsers that *don't* animate cross-document
      // navigations itself. `@supports` can't test the @view-transition
      // at-rule, and since Firefox 144 / Safari 18.0-18.1 support the
      // `view-transition-name` property (same-document) but still lack
      // cross-document transitions, the old `@supports not
      // (view-transition-name: root)` guard alone now wrongly disables the
      // fallback there too. The `pagereveal` event shipped in the same
      // release as cross-document transitions (Chrome 126+, Safari 18.2+),
      // so its absence is a reliable "this browser navigates instantly"
      // signal. Inline + synchronous + in <head> so the class lands before
      // first paint -- added later, the animation would start after a
      // full-opacity frame and flash-then-fade.
      if (!("pagereveal" in window)) document.documentElement.classList.add("no-cdt");
    </script>
</head>

<div class="app-window">
    <!-- Icons + a scrollable, snap-aligned row (see .tabbar in style.css)
         instead of the old plain-text flex row: on a phone-width viewport
         8 text labels either wrapped onto a second row (stealing height
         from a `position:sticky` bar) or got crushed, since there was no
         mobile treatment at all before. Kept as one scrollable list of
         real links rather than splitting into a duplicated "primary tabs
         here, rest behind a More menu" markup -- this app already avoids
         that kind of duplication (see README's tag/project precedent
         notes), and a single link per destination is one less place for
         active-state/URL logic to drift. `data-tab` marks the active
         link so app.js can scroll it into view on load without hardcoding
         per-tab knowledge in JS. -->
    <!-- 2026-08-01 Phase B nav rework: Projects/Habits/Contacts pulled off
         this bar entirely -- none of the three are touched often enough to
         earn permanent top-level real estate (a project/habit/contact is
         set up once, then rarely revisited as its own destination; the
         *content* -- previews, check-ins -- now lives on the Dashboard
         instead, see dashboard.html). Management for Projects/Habits moved
         to the new /settings section, reached via the gear icon below
         rather than a tab.

         2026-08-07: Contacts restored as a primary tabbar destination (a
         fully working, frequently-visited router that was previously
         reachable only via the Settings hub) -- Databases removed entirely
         in the same pass (see plans/label-space-rework.md's Grades/
         Databases deactivation-and-removal note; the feature and every
         route/table under it is gone, not just unlinked). Contacts' own
         sub-pages (detail/edit) all set active_tab="contacts" (routers/
         contacts.py), unchanged by this rework.

         2026-08-15: the Schedule tab (and the whole Schedule module --
         `/schedule`, day/time/parity class blocks, semester settings) is
         gone -- odd/even-week recurrence is now available on ordinary
         Calendar events (`recurrence_picker.js`), which fully superseded
