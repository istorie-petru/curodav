[project]
name = "command-center-desktop"
version = "0.1.0"
description = "Command Center Qt Desktop App"
requires-python = ">=3.12"
dependencies = [
    "PySide6>=6.8",
    "aiosqlite>=0.20",
    "watchdog>=4.0",
    "wsgidav>=4.3",
    "markdown-it-py>=3.0",
    "aiofiles>=24.0",
    "icalendar>=6.0",
    "vobject>=0.9.7",
]

[project.scripts]
command-center = "src.main:main"

[tool.pytest.ini_options]
pythonpath = ["src"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
