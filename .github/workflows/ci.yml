name: CI

# Runs the test suite on every push to main and every pull request, so a
# merge can't land without a green run. Tests were previously enforced only
# locally, with deploy.yml firing regardless of whether anyone had run them
# first. This only gates what merges -- deploy.yml is intentionally not made
# to depend on this job; branch protection is the place to wire that up if
# desired.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          python-version: "3.12"
      - name: Install dependencies
        working-directory: webapp
        run: uv sync
      - name: Run tests
        working-directory: webapp
        run: PYTHONPATH=src uv run python -m pytest -q
