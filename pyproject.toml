[project]
name = "curodav"
version = "4.8.7"
description = "Curodav is a personal organiser for one person: calendar, tasks, habits, contacts, a notebook and finance in one structure of spaces, shelves and tags, hosted by you, working offline, with no cloud account and no telemetry."
requires-python = ">=3.12"

[tool.uv.workspace]
members = ["webapp"]
