# Command Center Web (curodav) -- Docker Compose deploy.
#
#   docker compose up -d --build          # the app
#   docker compose --profile sync up -d   # + the optional Radicale server
#
# The compose file lives at deploy/docker/, so run it from there or pass
# -f deploy/docker/docker-compose.yml. The build context is the repo root
# (../..), and the optional /etc/curodav/curodav.env is picked up if it
# exists (the install script creates it; you can also copy the example).
services:
  curodav:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
    image: curodav:local
    container_name: curodav
    restart: unless-stopped
    # App has no auth of its own -- publish on 127.0.0.1 for Tailscale /
    # a reverse proxy, or delete the "127.0.0.1:" prefix to expose on the LAN.
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - path: /etc/curodav/curodav.env
        required: false
    volumes:
      # The container user's home -- the SQLite cache and backups live here.
      - curodav-data:/var/lib/curodav

  # Optional CalDAV/CardDAV server for phone sync (same image, different
  # command). Enable with:  docker compose --profile sync up -d
  radicale:
    image: curodav:local
    profiles: ["sync"]
    container_name: curodav-radicale
    restart: unless-stopped
    command: ["radicale", "--config", "/etc/radicale/config"]
    volumes:
      - radicale-collections:/var/lib/radicale/collections
      # config + users come from ./radicale (read-only). Copy
      # users.example -> users and edit it to set the sync password.
      - ./radicale:/etc/radicale:ro
    ports:
      - "127.0.0.1:5232:5232"

volumes:
  curodav-data:
  radicale-collections: